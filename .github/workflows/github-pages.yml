name: Build and deploy Flutter web to GitHub Pages

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ steps.flutter-version.outputs.version }}

      - name: Download Flutter SDK
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: >-
          git clone --depth 1
          --branch "${{ steps.flutter-version.outputs.version }}"
          https://github.com/flutter/flutter.git
          "${{ runner.tool_cache }}/flutter"

      - name: Add Flutter to PATH
        run: |
          echo "${{ runner.tool_cache }}/flutter/bin" >> "$GITHUB_PATH"
          "${{ runner.tool_cache }}/flutter/bin/flutter" config --no-analytics
          "${{ runner.tool_cache }}/flutter/bin/flutter" --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Analyze project
        run: flutter analyze

      - name: Test project
        run: flutter test

      - name: Build release project
        run: flutter build web --wasm --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
